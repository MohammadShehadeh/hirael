name: Vercel Production Deployment

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: vercel-production-deploy
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # v0.1.0–v0.7.0 are the one-time historical backfill (see
    # .github/workflows/seed-releases.yml). They were published all at once to
    # populate the /changelog and must NOT redeploy production through old
    # builds. Every other release — and any manual dispatch — deploys normally.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(
        ' v0.1.0 v0.2.0 v0.3.0 v0.4.0 v0.5.0 v0.6.0 v0.7.0 ',
        format(' {0} ', github.event.release.tag_name)
      )
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Vercel CLI
        run: npm install --global vercel@54

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        # The /changelog page fetches GitHub Releases during the build and the
        # result is frozen into the static export. Authenticate that fetch with
        # the workflow token so it can't hit the 60 req/hr unauthenticated rate
        # limit shared across all tenants of a runner's IP.
        env:
          GITHUB_TOKEN_HIRAEL: ${{ secrets.RELEASES_TOKEN }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} | tail -n1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"
