name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Registry in sync
        run: pnpm check:registry

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        # The /changelog page fetches GitHub Releases at build time; pass the
        # Actions token through so the fetch is authenticated and never hits the
        # unauthenticated rate limit. Falls back to anonymous if unset.
        env:
          GITHUB_TOKEN_HIRAEL: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm build

      - name: Install smoke test (real shadcn add)
        # Serves the built registry locally and runs the real shadcn CLI to
        # install a component into a throwaway project, asserting it lands under
        # components/ with imports rewritten and cross-hirael deps resolved.
        # Needs network (shadcn fetches base colors + primitives from
        # ui.shadcn.com), so it runs here rather than in the sandbox.
        run: pnpm check:install
