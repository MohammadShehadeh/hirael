allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
overrides:
  postcss: '>=8.5.10'

# pnpm 12 holds back releases younger than a day (minimumReleaseAge). These were
# upgraded on 2026-09-23, the day they shipped; the list can go once they age in.
minimumReleaseAgeExclude:
  - '@exodus/bytes@1.16.0'
  - '@next/env@16.3.6'
  - '@next/eslint-plugin-next@16.3.6'
  - '@next/swc-darwin-arm64@16.3.6'
  - '@next/swc-darwin-x64@16.3.6'
  - '@next/swc-linux-arm64-gnu@16.3.6'
  - '@next/swc-linux-arm64-musl@16.3.6'
  - '@next/swc-linux-x64-gnu@16.3.6'
  - '@next/swc-linux-x64-musl@16.3.6'
  - '@next/swc-win32-arm64-msvc@16.3.6'
  - '@next/swc-win32-x64-msvc@16.3.6'
  - '@shadcn/lint@0.2.0'
  - cn@0.4.0
  - eslint-config-next@16.3.6
  - framer-motion@13.4.1
  - motion-dom@13.4.1
  - motion@13.4.1
  - next@16.3.6
  - prettier@3.9.9
