name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Registry in sync
        run: pnpm check:registry

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        # The /changelog page fetches GitHub Releases at build time; pass the
        # Actions token through so the fetch is authenticated and never hits the
        # unauthenticated rate limit. Falls back to anonymous if unset.
        env:
          GITHUB_TOKEN_HIRAEL: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm build

      - name: Install resolution check
        # Verifies every item would install cleanly: applies shadcn's own
        # import-rewrite rules to the built /r/*.json and asserts each lands
        # under the right target with @/registry/hirael imports remapped to
        # consumer aliases and cross-hirael deps emitted as /r URLs. Offline and
        # deterministic — a real `shadcn add` can't run here (it stalls fetching
        # base colors from ui.shadcn.com).
        run: pnpm check:install
