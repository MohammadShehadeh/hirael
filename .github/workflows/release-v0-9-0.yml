name: Create v0.9.0 release

# One-off. Creates the v0.9.0 "Templates" GitHub Release at the current main
# commit (the templates tier, #39) using RELEASES_TOKEN. This is a real
# release — it is NOT in release-deploy.yml's backfill gate, so it deploys
# main to production as intended. Path-filtered to its own file (runs once on
# the commit that adds it) and idempotent. Delete this file once v0.9.0 exists.

on:
  push:
    branches: [claude/epic-allen-x6011u]
    paths: ['.github/workflows/release-v0-9-0.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create v0.9.0
        run: |
          set -euo pipefail
          if gh release view v0.9.0 >/dev/null 2>&1; then
            echo "v0.9.0 already exists — skipping"
            exit 0
          fi
          printf '%s\n' \
            'Highlights:' \
            '- New Templates tier: full-page layouts you install with the shadcn CLI and edit like any other file' \
            '- Creative Studio: a dark, cinematic landing page with an animated hero, a scroll-revealed about section, and a staggered feature grid' \
            '' \
            '<!-- date: 2026-06-13 -->' > /tmp/v0.9.0.md
          gh release create v0.9.0 \
            --target 6e710d73df8f5632da870a50da3725f48c0ccbf9 \
            --title "Templates" \
            --notes-file /tmp/v0.9.0.md
