name: Seed historical releases

# One-shot backfill. Turns the notes under .github/releases/ into GitHub
# Releases (v0.1.0–v0.7.0) so /changelog has content. Each release targets the
# commit the version shipped at; gh creates the tag at that commit. The first
# line of each note file is the release title, the rest is the body.
#
# Why a workflow: this repo's git remote rejects tag pushes, and there is no
# release API available locally, so creating Releases from the Actions token is
# the only path. The production-deploy workflow (release-deploy.yml) is gated to
# ignore exactly these seven tags, so seeding does NOT deploy anything. This job
# is idempotent (skips releases that already exist) and path-filtered to its own
# file, so it only runs on the commit that adds it. Safe to delete (with
# .github/releases/) once the releases exist.

on:
  push:
    branches: [claude/epic-allen-x6011u]
    paths: [.github/workflows/seed-releases.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create releases from .github/releases notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # tag:commit — oldest first so v0.7.0 ends up marked "Latest".
          RELEASES="
          v0.1.0:b955e9ae7e0845278aa9a1cce6ee7a616890aceb
          v0.2.0:cc48fea3a2b9d13083f7e15f2bf046eae2ca1b5b
          v0.3.0:f3beb6674d3efcc72a2a49fe0cc9cc05fe8264c4
          v0.4.0:a375363ce0e09a5a09d50f6eb7d44902b16e50fa
          v0.5.0:9bd0e059b73e0cd286c67b92a3e73c86e322aef6
          v0.6.0:f0edc507f5442fe996d5d00a29fa5c0cc520718b
          v0.7.0:33103aba430de1bc5537c4c4b77e48f3fbde9cc4
          v0.8.0:bdfab5db98d2c579bce8467cb90d0e7bd469a0c5
          "
          for ENTRY in $RELEASES; do
            TAG=${ENTRY%%:*}
            SHA=${ENTRY##*:}
            FILE=".github/releases/$TAG.md"
            if [ ! -f "$FILE" ]; then
              echo "::error::missing $FILE"; exit 1
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "release $TAG already exists — skipping"
              continue
            fi
            TITLE=$(sed -n '1p' "$FILE")
            tail -n +3 "$FILE" > /tmp/notes.md
            echo "creating release $TAG @ ${SHA:0:7} — $TITLE"
            gh release create "$TAG" \
              --target "$SHA" \
              --title "$TITLE" \
              --notes-file /tmp/notes.md
          done
